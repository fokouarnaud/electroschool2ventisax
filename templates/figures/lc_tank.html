{% load i18n %}<figure class="fig" data-fig="lc_tank">
  <div class="fig-plate">
    <div class="fig-corners" aria-hidden="true"><span>{% translate "Fig. 1" %}</span><span>{% translate "Le circuit bouchon, côté eau" %}</span></div>
    <div class="fig-stage" role="img" aria-label="{% translate 'Banc hydraulique : un piston pousse l’eau à travers une vanne étranglée coiffée d’un débitmètre jusqu’à un nœud coiffé d’un manomètre ; du nœud partent en parallèle, vers le bac, une roue à volant à l’arrière et une cloche à membrane à l’avant.' %}">{{ svg }}</div>
    <div class="fig-controls" data-fig-controls hidden>
      <div class="fig-freq">
        <label for="fig-lc_tank-freq">{% translate "Fréquence" %}</label>
        <input id="fig-lc_tank-freq" type="range" min="0" max="400" step="1" value="270" data-fig-freq>
      </div>
      <div class="fig-buttons">
        <button type="button" class="btn btn-ghost" data-fig-preset="low">f0 / 2</button>
        <button type="button" class="btn btn-ghost" data-fig-preset="f0">f0</button>
        <button type="button" class="btn btn-ghost" data-fig-preset="high">2 × f0</button>
        <button type="button" class="btn" data-fig-play data-play="{% translate 'Lecture' %}" data-pause="{% translate 'Pause' %}" aria-pressed="false">{% translate "Lecture" %}</button>
      </div>
      <dl class="fig-readout" aria-live="polite">
        <div><dt>f</dt><dd data-fig-out="f"></dd></div>
        <div><dt>{% translate "Z du bouchon" %}</dt><dd data-fig-out="z"></dd></div>
        <div><dt>{% translate "I de ligne" %}</dt><dd data-fig-out="i"></dd></div>
        <div><dt>IL / IC</dt><dd data-fig-out="ilc"></dd></div>
        <div><dt>{% translate "Vt / Ve" %}</dt><dd data-fig-out="vt"></dd></div>
      </dl>
      <p class="fig-note">{% translate "Mouvement ralenti : la cadence n’est pas à l’échelle, les amplitudes et les phases le sont." %}</p>
    </div>
  </div>
  <figcaption class="fig-legend">
    <ul>
      <li><strong>{% translate "Piston :" %}</strong> {% translate "générateur, tension d’entrée de 1 V" %}</li>
      <li><strong>{% translate "Vanne étranglée :" %}</strong> {% translate "résistance Rs = 10 kΩ, en série ; son débitmètre (aiguille teal) lit le courant de ligne" %}</li>
      <li><strong>{% translate "Manomètre du nœud :" %}</strong> {% translate "tension Vt aux bornes du bouchon, ±1 V en bout d’échelle" %}</li>
      <li><strong>{% translate "Roue à volant :" %}</strong> {% translate "bobine L = 10 mH (10 Ω de pertes), en parallèle avec la cloche ; son repère suit le courant de la bobine, à la même échelle que le débitmètre (±2 mA)" %}</li>
      <li><strong>{% translate "Cloche à membrane :" %}</strong> {% translate "condensateur C = 100 nF, en parallèle avec la roue" %}</li>
      <li><strong>{% translate "Bac de retour :" %}</strong> {% translate "masse, où se rejoignent les deux branches" %}</li>
    </ul>
  </figcaption>
</figure>
