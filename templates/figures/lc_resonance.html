{% load i18n %}<figure class="fig" data-fig="lc_resonance">
  <div class="fig-plate">
    <div class="fig-corners" aria-hidden="true"><span>{% translate "Fig. 1" %}</span><span>{% translate "La résonance, côté eau" %}</span></div>
    <div class="fig-stage" role="img" aria-label="{% translate 'Banc hydraulique : un piston pousse l’eau à travers trois pièces en série, une vanne étranglée coiffée d’un débitmètre, une roue à aubes lestée d’un volant, puis une cloche à membrane, avant le bac.' %}">{{ svg }}</div>
    <div class="fig-controls" data-fig-controls hidden>
      <div class="fig-freq">
        <label for="fig-lc_resonance-freq">{% translate "Fréquence" %}</label>
        <input id="fig-lc_resonance-freq" type="range" min="0" max="400" step="1" value="240" data-fig-freq>
      </div>
      <div class="fig-buttons">
        <button type="button" class="btn btn-ghost" data-fig-preset="low">f0 / 2</button>
        <button type="button" class="btn btn-ghost" data-fig-preset="f0">f0</button>
        <button type="button" class="btn btn-ghost" data-fig-preset="high">2 × f0</button>
        <button type="button" class="btn" data-fig-play data-play="{% translate 'Lecture' %}" data-pause="{% translate 'Pause' %}" aria-pressed="false">{% translate "Lecture" %}</button>
      </div>
      <dl class="fig-readout" aria-live="polite">
        <div><dt>f</dt><dd data-fig-out="f"></dd></div>
        <div><dt>XL / XC</dt><dd data-fig-out="x"></dd></div>
        <div><dt>Z</dt><dd data-fig-out="z"></dd></div>
        <div><dt>{% translate "I (sous 1 V)" %}</dt><dd data-fig-out="i"></dd></div>
        <div><dt>{% translate "Vc (sous 1 V)" %}</dt><dd data-fig-out="vc"></dd></div>
      </dl>
      <p class="fig-note">{% translate "Mouvement ralenti : la cadence n’est pas à l’échelle, les amplitudes et les phases le sont." %}</p>
    </div>
  </div>
  <figcaption class="fig-legend">
    <ul>
      <li><strong>{% translate "Piston :" %}</strong> {% translate "générateur, tension d’entrée de 1 V" %}</li>
      <li><strong>{% translate "Vanne étranglée :" %}</strong> {% translate "résistance R = 50 Ω, en série" %}</li>
      <li><strong>{% translate "Débitmètre :" %}</strong> {% translate "courant i, le même dans les trois pièces ; l’aiguille va au bout de l’échelle pour Imax = 20 mA, à f0" %}</li>
      <li><strong>{% translate "Roue à volant :" %}</strong> {% translate "bobine L = 10 mH, en série ; son inertie s’oppose aux changements de débit" %}</li>
      <li><strong>{% translate "Cloche à membrane :" %}</strong> {% translate "condensateur C = 100 nF, en série ; aucune eau ne traverse la membrane, qui se tend et se détend" %}</li>
      <li><strong>{% translate "Bac de retour :" %}</strong> {% translate "masse" %}</li>
    </ul>
  </figcaption>
</figure>
