{% load i18n %}<figure class="fig" data-fig="rc_highpass">
  <div class="fig-plate">
    <div class="fig-corners" aria-hidden="true"><span>{% translate "Fig. 1" %}</span><span>{% translate "Le passe-haut, côté eau" %}</span></div>
    <div class="fig-stage" role="img" aria-label="{% translate 'Banc hydraulique : un piston pousse l’eau contre la membrane d’une cloche placée en série ; derrière elle, une vanne étranglée mène l’eau au bac ; un manomètre mesure la pression entre la cloche et la vanne.' %}">{{ svg }}</div>
    <div class="fig-controls" data-fig-controls hidden>
      <div class="fig-freq">
        <label for="fig-rc_highpass-freq">{% translate "Fréquence" %}</label>
        <input id="fig-rc_highpass-freq" type="range" min="0" max="400" step="1" value="100" data-fig-freq>
      </div>
      <div class="fig-buttons">
        <button type="button" class="btn btn-ghost" data-fig-preset="low">{% translate "Basse" %}</button>
        <button type="button" class="btn btn-ghost" data-fig-preset="fc">fc</button>
        <button type="button" class="btn btn-ghost" data-fig-preset="high">{% translate "Haute" %}</button>
        <button type="button" class="btn" data-fig-play data-play="{% translate 'Lecture' %}" data-pause="{% translate 'Pause' %}" aria-pressed="false">{% translate "Lecture" %}</button>
      </div>
      <dl class="fig-readout" aria-live="polite">
        <div><dt>f</dt><dd data-fig-out="f"></dd></div>
        <div><dt>Xc</dt><dd data-fig-out="xc"></dd></div>
        <div><dt>Vs / Ve</dt><dd data-fig-out="ratio"></dd></div>
        <div><dt>{% translate "Déphasage" %}</dt><dd data-fig-out="phase"></dd></div>
      </dl>
      <p class="fig-note">{% translate "Mouvement ralenti : la cadence n’est pas à l’échelle, les amplitudes et l’avance le sont." %}</p>
    </div>
  </div>
  <figcaption class="fig-legend">
    <ul>
      <li><strong>{% translate "Piston :" %}</strong> {% translate "générateur, tension d’entrée Ve" %}</li>
      <li><strong>{% translate "Cloche à membrane :" %}</strong> {% translate "condensateur C = 100 nF, en série ; aucune eau ne traverse la membrane, sa tige suit la tension Vc du condensateur" %}</li>
      <li><strong>{% translate "Vanne étranglée :" %}</strong> {% translate "résistance R = 1 kΩ, vers la masse" %}</li>
      <li><strong>{% translate "Bac de retour :" %}</strong> {% translate "masse" %}</li>
      <li><strong>{% translate "Manomètre :" %}</strong> {% translate "tension de sortie Vs, aux bornes de la vanne comme Vs aux bornes de R ; ses deux repères marquent 0,707, la coupure" %}</li>
    </ul>
  </figcaption>
</figure>
