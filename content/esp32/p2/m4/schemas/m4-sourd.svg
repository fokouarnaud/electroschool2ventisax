<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Chronogramme d'un clignotant écrit avec delay, sans légende</title><rect width="560" height="170" rx="14" fill="#fcfefe"/><text x="100" y="24" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">LED</text><polyline points="110,30 530,30" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><polyline points="110,30 110,30 110,8 320,8 320,30 530,30" fill="none" stroke="#173f58" stroke-width="2.5" stroke-linejoin="round"/><rect x="110" y="75" width="210" height="26" fill="#c9d8dd" stroke="#173f58" stroke-width="1"/><text x="215" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">delay(500)</text><rect x="320" y="75" width="40" height="26" fill="#fcfefe" stroke="#173f58" stroke-width="1"/><text x="340" y="93" text-anchor="middle" font-size="10" font-weight="400" fill="#173f58">loop</text></svg>
