; platformio.ini de référence de la formation « Microcontrôleurs : l'ESP32 » (C4, C16).
; Plateforme officielle espressif32 8.0.0 = cœur Arduino-ESP32 3.3.12. Versions figées : ne pas les modifier sans
; recompiler tous les croquis (python tools/sketches.py).
[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit GFX Library @ 1.13.0
    adafruit/Adafruit BME280 Library @ 2.3.0
