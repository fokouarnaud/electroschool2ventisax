<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Montage commandé par un serveur web, sans légende des transistors</title><rect width="560" height="260" rx="14" fill="#fcfefe"/><rect x="20" y="90" width="140" height="80" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="90" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">ESP32</text><rect x="20" y="20" width="200" height="56" rx="6" fill="#173f58"/><text x="30" y="42" text-anchor="start" font-size="11" font-weight="400" fill="#fcfefe">server.on("/on", ...)</text><text x="30" y="64" text-anchor="start" font-size="11" font-weight="400" fill="#fcfefe">→ digitalWrite(26, HIGH)</text><polyline points="160,110 300,110" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="170" y="105" text-anchor="start" font-size="10" font-weight="600" fill="#173f58">GPIO 26</text><rect x="300" y="90" width="70" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="335" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58"></text><polyline points="370,110 420,110" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="420" y="90" width="120" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="480" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">lampe 12 V</text><polyline points="160,170 300,170" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="170" y="165" text-anchor="start" font-size="10" font-weight="600" fill="#173f58">GPIO 27</text><rect x="300" y="150" width="70" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="335" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58"></text><polyline points="370,170 420,170" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="420" y="150" width="120" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="480" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">buzzer</text></svg>
