<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Chaîne d'un système à microcontrôleur : un capteur est lu, le programme calcule, un actionneur est commandé</title><rect width="560" height="170" rx="14" fill="#fcfefe"/><rect x="20" y="50" width="140" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="90" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">Capteur</text><rect x="210" y="50" width="140" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="280" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#173f58">ESP32</text><rect x="400" y="50" width="140" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="470" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">Actionneur</text><polyline points="160,80 208,80" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="208,80 199.9,83.9 199.9,76.1" fill="#173f58"/><text x="184" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">lire</text><polyline points="350,80 398,80" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="398,80 389.9,83.9 389.9,76.1" fill="#173f58"/><text x="374" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">commander</text><text x="280" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">calculer</text><text x="90" y="135" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">bouton, potentiomètre</text><text x="470" y="135" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">LED, moteur, relais</text></svg>
