<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Les trois mémoires : la Flash garde le programme sans courant, la SRAM porte les variables et s'efface à la coupure, la ROM contient le démarrage</title><rect width="560" height="210" rx="14" fill="#fcfefe"/><text x="130" y="52" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">Flash 4 Mo</text><rect x="140" y="30" width="400" height="30" rx="4" fill="#0d665e" stroke="#173f58" stroke-width="1.5"/><text x="150" y="80" text-anchor="start" font-size="11" font-weight="400" fill="#173f58">programme (garde sans courant)</text><text x="130" y="110" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">SRAM 520 Ko</text><rect x="140" y="88" width="52" height="30" rx="4" fill="#c9d8dd" stroke="#173f58" stroke-width="1.5"/><text x="202" y="108" text-anchor="start" font-size="11" font-weight="400" fill="#7d93a0">variables (effacée à la coupure)</text><text x="130" y="168" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">ROM 448 Ko</text><rect x="140" y="146" width="45" height="30" rx="4" fill="#c9d8dd" stroke="#173f58" stroke-width="1.5"/><text x="195" y="166" text-anchor="start" font-size="11" font-weight="400" fill="#7d93a0">démarrage (gravée en usine)</text></svg>
