<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Montage du mini-projet : la carte reliée à l'ordinateur par USB affiche sa carte d'identité dans le moniteur série</title><rect width="560" height="180" rx="14" fill="#fcfefe"/><rect x="20" y="50" width="150" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="95" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">ordinateur</text><rect x="380" y="50" width="160" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="460" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">carte ESP32</text><polyline points="170,80 378,80" fill="none" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><text x="275" y="70" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">câble USB</text><text x="95" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#0d665e">Moniteur série à 115 200 bit/s</text><text x="460" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#173f58">LED intégrée</text><text x="95" y="160" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">Modèle, cœurs, fréquence, Flash</text></svg>
