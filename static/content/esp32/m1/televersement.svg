<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Les trois étapes du téléversement : compilation, écriture dans la Flash, redémarrage</title><rect width="560" height="200" rx="14" fill="#fcfefe"/><rect x="20" y="40" width="160" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="100" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">1. Compilation</text><text x="100" y="120" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">PlatformIO traduit le C++ en code machine</text><polyline points="180,65 198,65" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="198,65 189.9,68.9 189.9,61.1" fill="#173f58"/><rect x="200" y="40" width="160" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="280" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">2. Téléversement</text><text x="280" y="120" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">le code est écrit dans la Flash</text><polyline points="360,65 378,65" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="378,65 369.9,68.9 369.9,61.1" fill="#173f58"/><rect x="380" y="40" width="160" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="460" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">3. Redémarrage</text><text x="460" y="120" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">le programme démarre : setup puis loop</text></svg>
