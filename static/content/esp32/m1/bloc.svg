<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Schéma bloc fonctionnel : le CPU écrit dans les registres GPIO et les périphériques par le bus interne ; la matrice GPIO et l'IO MUX aiguillent chaque signal vers un plot d'entrée-sortie, relié à une broche du module puis à une broche de la carte</title><rect width="640" height="330" rx="14" fill="#fcfefe"/><rect x="20" y="20" width="510" height="285" rx="12" fill="#fcfefe" stroke="#173f58" stroke-width="2" stroke-dasharray="6 4"/><text x="120" y="296" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">puce ESP32</text><rect x="35" y="120" width="115" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="92.5" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#173f58">CPU</text><text x="92" y="198" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">2 cœurs, 240 MHz</text><polyline points="172,45 172,275" fill="none" stroke="#173f58" stroke-width="5" stroke-linejoin="round"/><text x="172" y="38" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">bus interne</text><polyline points="150,150 170,150" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="195" y="55" width="125" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="257.5" y="89" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">Registres GPIO</text><text x="257" y="132" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">ENABLE, OUT, IN</text><rect x="195" y="175" width="125" height="70" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="257.5" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">Périphériques</text><text x="257" y="262" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">UART, I2C, SPI, LEDC</text><polyline points="174,85 193,85" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="174,210 193,210" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="345" y="45" width="70" height="230" rx="6" fill="#dfe8ea" stroke="#173f58" stroke-width="2"/><text x="380" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">matrice</text><text x="380" y="156" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">GPIO</text><text x="380" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">et</text><text x="380" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">IO MUX</text><polyline points="320,85 343,85" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="343,85 334.9,88.9 334.9,81.1" fill="#173f58"/><polyline points="320,210 343,210" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="343,210 334.9,213.9 334.9,206.1" fill="#173f58"/><polyline points="415,75 438,75" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="438" y="57" width="80" height="36" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="478" y="79" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">plot</text><text x="478" y="107" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">GPIO 4</text><polyline points="518,75 568,75" fill="none" stroke="#173f58" stroke-width="2.5" stroke-linejoin="round"/><rect x="525" y="70" width="10" height="10" fill="#173f58"/><circle cx="573" cy="75" r="5" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="585" y="80" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">G4</text><polyline points="415,160 438,160" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="438" y="142" width="80" height="36" rx="8" fill="#eef