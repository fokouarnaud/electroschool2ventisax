<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Autonomie sur une pile de 2 000 mAh : environ 20 heures à 100 mA, environ 23 ans à 10 µA ; la veille profonde change tout</title><rect width="560" height="170" rx="14" fill="#fcfefe"/><rect x="20" y="50" width="160" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="100" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">pile de 2 000 mAh</text><rect x="240" y="20" width="300" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="390" y="49" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">100 mA : 20 h</text><rect x="240" y="90" width="300" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="390" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">10 µA : 200 000 h ≈ 23 ans</text><polyline points="180,80 240,45" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="180,80 240,115" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/></svg>
