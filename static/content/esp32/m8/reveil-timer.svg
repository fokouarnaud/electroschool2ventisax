<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Après une veille profonde, la puce redémarre : setup s'exécute de nouveau, et loop n'est jamais atteinte si setup se rendort</title><rect width="560" height="200" rx="14" fill="#fcfefe"/><rect x="20" y="70" width="140" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="90" y="99" text-anchor="middle" font-size="14" font-weight="600" fill="#173f58">setup()</text><rect x="210" y="70" width="140" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="280" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">mesurer</text><rect x="400" y="70" width="140" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="470" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">dormir 10 s</text><polyline points="160,95 208,95" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="208,95 199.9,98.9 199.9,91.1" fill="#173f58"/><polyline points="350,95 398,95" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="398,95 389.9,98.9 389.9,91.1" fill="#173f58"/><polyline points="470,120 470,165 90,165 90,122" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><text x="280" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#0d665e">réveil : setup() recommence</text></svg>
