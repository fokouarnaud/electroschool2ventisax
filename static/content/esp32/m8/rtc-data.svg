<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Une variable marquée RTC_DATA_ATTR est rangée en mémoire RTC : elle survit à la veille profonde et compte les réveils</title><rect width="560" height="170" rx="14" fill="#fcfefe"/><rect x="40" y="50" width="100" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="90" y="79" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">bootCount = 1</text><polyline points="140,75 168,75" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="168,75 159.9,78.9 159.9,71.1" fill="#0d665e"/><rect x="170" y="50" width="100" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="220" y="79" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">bootCount = 2</text><polyline points="270,75 298,75" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="298,75 289.9,78.9 289.9,71.1" fill="#0d665e"/><rect x="300" y="50" width="100" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="350" y="79" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">bootCount = 3</text><polyline points="400,75 428,75" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="428,75 419.9,78.9 419.9,71.1" fill="#0d665e"/><rect x="430" y="50" width="100" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="480" y="79" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">bootCount = 4</text><text x="280" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">bootCount en mémoire RTC : 1, 2, 3…</text></svg>
