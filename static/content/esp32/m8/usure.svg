<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>La Flash s'use : environ 100 000 écritures par cellule ; on n'écrit qu'en cas de changement, jamais à chaque tour de boucle</title><rect width="560" height="160" rx="14" fill="#fcfefe"/><polyline points="60,120 500,120" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><polyline points="60,40 420,40 500,120" fill="none" stroke="#0d665e" stroke-width="3" stroke-linejoin="round"/><text x="280" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">environ 100 000 écritures par cellule</text></svg>
