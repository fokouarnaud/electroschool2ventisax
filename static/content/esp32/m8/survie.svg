<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Ce qui survit : la Flash garde tout ; la SRAM perd tout à la coupure comme en veille profonde ; la mémoire RTC garde ses données en veille profonde, pas à la coupure</title><rect width="560" height="200" rx="14" fill="#fcfefe"/><text x="270" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#173f58">coupure</text><text x="430" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#173f58">veille profonde</text><rect x="40" y="50" width="150" height="36" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="115" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">Flash</text><text x="270" y="73" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">garde</text><text x="430" y="73" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">garde</text><rect x="40" y="96" width="150" height="36" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="115" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">SRAM</text><text x="270" y="119" text-anchor="middle" font-size="12" font-weight="600" fill="#7d93a0">perd</text><text x="430" y="119" text-anchor="middle" font-size="12" font-weight="600" fill="#7d93a0">perd</text><rect x="40" y="142" width="150" height="36" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="115" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">mémoire RTC</text><text x="270" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#7d93a0">perd</text><text x="430" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">garde</text></svg>
