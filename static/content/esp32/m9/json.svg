<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>La route /mesure renvoie un texte JSON que la page relit toutes les 2 s, sans recharger toute la page</title><rect width="560" height="170" rx="14" fill="#fcfefe"/><rect x="40" y="30" width="480" height="70" rx="8" fill="#173f58"/><text x="60" y="72" text-anchor="start" font-size="14" font-weight="400" fill="#fcfefe">{"tension_mV": 1650, "lampe": true}</text><text x="280" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">toutes les 2 s</text></svg>
