<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="560" height="260" rx="14" fill="#fcfefe"/><rect x="30" y="30" width="22" height="18" rx="3" fill="#fcfefe" stroke="#173f58" stroke-width="1.5"/><path d="M34 33 l14 12 M48 33 l-14 12" stroke="#173f58" stroke-width="1.5"/><text x="65" y="44" text-anchor="start" font-size="13" font-weight="700" fill="#173f58">Flash: do not use</text><text x="65" y="64" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">GPIO 6 to 11: wired to the Flash memory</text><rect x="30" y="85" width="22" height="18" rx="3" fill="#fcfefe" stroke="#173f58" stroke-width="1.5"/><path d="M33 100 l8 -12 M39 100 l8 -12 M45 100 l5 -8" stroke="#7d93a0" stroke-width="1.5"/><text x="65" y="99" text-anchor="start" font-size="13" font-weight="700" fill="#173f58">Input only</text><text x="65" y="119" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">GPIO 34, 35, 36, 39: no output, no internal pull</text><rect x="30" y="140" width="22" height="18" rx="3" fill="#fcfefe" stroke="#173f58" stroke-width="1.5"/><text x="41" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">!</text><text x="65" y="154" text-anchor="start" font-size="13" font-weight="700" fill="#173f58">Strapping: caution</text><text x="65" y="174" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">GPIO 0, 2, 5, 12, 15: read at boot</text><rect x="30" y="195" width="22" height="18" rx="3" fill="#fcfefe" stroke="#173f58" stroke-width="1.5"/><text x="65" y="209" text-anchor="start" font-size="13" font-weight="700" fill="#173f58">Safe pin</text><text x="65" y="229" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">all others: LED, button, MOSFET</text></svg>
