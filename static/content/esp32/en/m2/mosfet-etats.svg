<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="560" height="170" rx="14" fill="#fcfefe"/><rect x="20" y="40" width="255" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="147.5" y="69" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">GPIO LOW: MOSFET off, motor stopped</text><rect x="285" y="40" width="255" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="412.5" y="69" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">GPIO HIGH: MOSFET on, motor running</text><text x="280" y="130" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">logic-level MOSFET: on from 3.3 V on the gate</text></svg>
