<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Deux cartes reliées par l'UART 2 : le TX de l'une va au RX de l'autre, et les masses sont communes</title><rect width="560" height="200" rx="14" fill="#fcfefe"/><rect x="30" y="40" width="150" height="120" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="105" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">carte A</text><rect x="380" y="40" width="150" height="120" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="455" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">carte B</text><polyline points="180,70 380,120" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="180,120 380,70" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="180,145 380,145" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="190" y="64" text-anchor="start" font-size="10" font-weight="600" fill="#173f58">TX 17</text><text x="190" y="114" text-anchor="start" font-size="10" font-weight="600" fill="#173f58">RX 16</text><text x="370" y="64" text-anchor="end" font-size="10" font-weight="600" fill="#173f58">RX 16</text><text x="370" y="114" text-anchor="end" font-size="10" font-weight="600" fill="#173f58">TX 17</text><text x="280" y="140" text-anchor="middle" font-size="10" font-weight="600" fill="#173f58">GND</text><text x="280" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#0d665e">TX vers RX, RX vers TX, GND commun</text></svg>
