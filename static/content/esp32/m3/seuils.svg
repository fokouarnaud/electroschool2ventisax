<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Seuils d'une entrée de l'ESP32 : au-dessus de 2,5 V environ elle lit 1, en dessous de 0,8 V environ elle lit 0, entre les deux le niveau est indéterminé</title><rect width="520" height="230" rx="14" fill="#fcfefe"/><rect x="120" y="30" width="120" height="60" fill="#d7ecea" stroke="#173f58" stroke-width="1.5"/><rect x="120" y="90" width="120" height="70" fill="#fcfefe" stroke="#173f58" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="120" y="160" width="120" height="40" fill="#c9d8dd" stroke="#173f58" stroke-width="1.5"/><text x="110" y="35" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">3,3 V</text><text x="110" y="95" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">2,5 V</text><text x="110" y="165" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">0,8 V</text><text x="110" y="205" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">0 V</text><text x="260" y="65" text-anchor="start" font-size="12" font-weight="600" fill="#173f58">lu comme 1</text><text x="260" y="130" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">zone indéterminée</text><text x="260" y="185" text-anchor="start" font-size="12" font-weight="600" fill="#173f58">lu comme 0</text></svg>
