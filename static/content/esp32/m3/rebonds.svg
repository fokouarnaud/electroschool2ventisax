<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Rebonds d'un bouton : à l'appui, le contact s'ouvre et se ferme plusieurs fois pendant quelques millisecondes avant de se stabiliser</title><rect width="560" height="170" rx="14" fill="#fcfefe"/><polyline points="60,50 200,50 200,110 210,110 210,50 218,50 218,110 224,110 224,55 229,55 229,110 480,110" fill="none" stroke="#0d665e" stroke-width="2.5" stroke-linejoin="round"/><text x="50" y="55" text-anchor="end" font-size="11" font-weight="400" fill="#173f58">relâché</text><text x="50" y="115" text-anchor="end" font-size="11" font-weight="400" fill="#173f58">appuyé</text><rect x="195" y="35" width="40" height="90" fill="none" stroke="#7d93a0" stroke-dasharray="4 3"/><text x="215" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">rebonds</text><text x="380" y="100" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">état stable</text></svg>
