<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Structure de loop() : lire toutes les entrées, calculer, puis écrire toutes les sorties</title><rect width="560" height="180" rx="14" fill="#fcfefe"/><rect x="20" y="40" width="160" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="100" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">1. lire les entrées</text><polyline points="180,65 198,65" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="198,65 189.9,68.9 189.9,61.1" fill="#173f58"/><rect x="200" y="40" width="160" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="280" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">2. calculer</text><polyline points="360,65 378,65" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="378,65 369.9,68.9 369.9,61.1" fill="#173f58"/><rect x="380" y="40" width="160" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="460" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">3. écrire les sorties</text><polyline points="500,90 500,130 100,130 100,92" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><text x="300" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="#0d665e">loop() recommence</text></svg>
