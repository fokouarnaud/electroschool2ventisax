<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Une trame I2C : départ, adresse de 7 bits, bit de lecture ou d'écriture, acquittement de l'appareil, puis les données</title><rect width="560" height="150" rx="14" fill="#fcfefe"/><rect x="20" y="50" width="54" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="47" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">départ</text><rect x="80" y="50" width="144" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="152" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">adresse</text><rect x="230" y="50" width="44" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="252" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">R/W</text><rect x="280" y="50" width="44" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="302" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">ACK</text><rect x="330" y="50" width="144" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="402" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">donnée</text><text x="140" y="120" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">adresse de 7 bits</text><text x="340" y="120" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">acquittement</text></svg>
