<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Le capteur BME280 sur le même bus I2C mesure la température, l'humidité et la pression</title><rect width="560" height="200" rx="14" fill="#fcfefe"/><rect x="20" y="60" width="130" height="80" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="85" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#173f58">ESP32</text><rect x="210" y="60" width="130" height="80" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="275" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">BME280</text><polyline points="150,90 210,90" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="150,110 210,110" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="380" y="30" width="160" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="460" y="54" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">23,5 °C</text><text x="372" y="54" text-anchor="end" font-size="10" font-weight="400" fill="#173f58">température</text><rect x="380" y="82" width="160" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="460" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">48 %</text><text x="372" y="106" text-anchor="end" font-size="10" font-weight="400" fill="#173f58">humidité</text><rect x="380" y="134" width="160" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="460" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">1 013 hPa</text><text x="372" y="158" text-anchor="end" font-size="10" font-weight="400" fill="#173f58">pression</text></svg>
