<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Trois liaisons série de l'ESP32 : l'UART relie deux appareils, l'I2C en relie beaucoup sur deux fils, le SPI va plus vite avec quatre fils</title><rect width="560" height="200" rx="14" fill="#fcfefe"/><rect x="20" y="25" width="110" height="42" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="75" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">UART</text><text x="150" y="51" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">UART : 2 fils, 1 appareil</text><rect x="20" y="83" width="110" height="42" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="75" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">I2C</text><text x="150" y="109" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">I2C : 2 fils, jusqu'à 127 appareils</text><rect x="20" y="141" width="110" height="42" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="75" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">SPI</text><text x="150" y="167" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">SPI : 4 fils, très rapide</text></svg>
