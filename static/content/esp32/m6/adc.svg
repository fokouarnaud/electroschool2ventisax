<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Le convertisseur analogique-numérique de 12 bits traduit une tension de 0 à 3,3 V en une valeur de 0 à 4 095</title><rect width="560" height="230" rx="14" fill="#fcfefe"/><polyline points="76,190 514,190" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="514,190 505.9,193.9 505.9,186.1" fill="#173f58"/><polyline points="80,194 80,6" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="80,6 83.9,14.1 76.1,14.1" fill="#173f58"/><text x="514" y="180" text-anchor="end" font-size="12" font-weight="400" fill="#173f58">tension (V)</text><text x="88" y="16" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">valeur lue</text><polyline points="80,187 80,193" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="80" y="206" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">0</text><polyline points="290,187 290,193" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="290" y="206" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">1,65</text><polyline points="500,187 500,193" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="500" y="206" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">3,3</text><polyline points="77,190 83,190" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="74" y="194" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">0</text><polyline points="77,105 83,105" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="74" y="109" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">2048</text><polyline points="77,20 83,20" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="