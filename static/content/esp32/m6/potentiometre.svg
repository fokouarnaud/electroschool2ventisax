<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Un potentiomètre de 10 kΩ entre 3,3 V et GND : son curseur donne une tension de 0 à 3,3 V lue par GPIO 34</title><rect width="480" height="240" rx="14" fill="#fcfefe"/><text x="150" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">3,3 V</text><polyline points="150,30 150,60" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(150,60) rotate(90)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="52" y2="0"/><line x1="88" y1="0" x2="140" y2="0"/><g transform="translate(52,0)"><rect x="0" y="-7" width="36" height="14" rx="2" fill="#fcfefe"/></g></g><text x="132" y="128" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">10 kΩ</text><polyline points="150,200 150,208" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="138,208 162,208" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="142,213 158,213" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="146,218 154,218" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="215,130 162,130" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="162,130 170.1,126.1 170.1,133.9" fill="#173f58"/><polyline points="215,130 300,130" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><circle cx="305" cy="130" r="5" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="317" y="135" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">GPIO 34</text><text x="260" y="120" text-anchor="middle" font-size="10" font-weight="400" fill="#7d93a0">curseur vers GPIO 34</text></svg>
