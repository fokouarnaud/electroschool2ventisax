<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Règles d'une routine d'interruption : courte, variables partagées volatile, IRAM_ATTR, jamais de delay ni de Serial</title><rect width="560" height="200" rx="14" fill="#fcfefe"/><rect x="30" y="30" width="240" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="150" y="59" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">courte : quelques lignes</text><rect x="290" y="30" width="240" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="410" y="59" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">volatile : variables partagées</text><rect x="30" y="110" width="240" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="150" y="139" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">IRAM_ATTR : en mémoire rapide</text><rect x="290" y="110" width="240" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="410" y="139" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">jamais delay ni Serial</text></svg>
