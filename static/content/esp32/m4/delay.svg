<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Avec delay, le programme attend sans rien faire : un appui pendant l'attente n'est pas vu</title><rect width="560" height="200" rx="14" fill="#fcfefe"/><text x="140" y="24" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">LED</text><polyline points="150,30 510,30" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><polyline points="150,30 150,30 150,8 330,8 330,30 510,30" fill="none" stroke="#173f58" stroke-width="2.5" stroke-linejoin="round"/><text x="140" y="79" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">bouton</text><polyline points="150,85 510,85" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><polyline points="150,85 222,85 222,63 258,63 258,85 510,85" fill="none" stroke="#0d665e" stroke-width="2.5" stroke-linejoin="round"/><line x1="330" y1="0" x2="330" y2="116" stroke="#7d93a0" stroke-dasharray="4 3"/><text x="330" y="132" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">500 ms</text><rect x="150" y="125" width="180" height="22" fill="#c9d8dd" stroke="#173f58" stroke-width="1"/><text x="240" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">delay(500)</text><text x="258" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">bouton ignoré</text></svg>
