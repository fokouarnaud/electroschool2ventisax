<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Timer matériel : l'horloge de 80 MHz est divisée pour compter à 1 MHz ; l'alarme à 1 000 000 déclenche la routine chaque seconde</title><rect width="560" height="180" rx="14" fill="#fcfefe"/><rect x="10" y="60" width="125" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="72.5" y="89" text-anchor="middle" font-size="10" font-weight="600" fill="#173f58">horloge 80 MHz</text><polyline points="135,85 148,85" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="148,85 139.9,88.9 139.9,81.1" fill="#173f58"/><rect x="150" y="60" width="125" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="212.5" y="89" text-anchor="middle" font-size="10" font-weight="600" fill="#173f58">compteur à 1 MHz</text><polyline points="275,85 288,85" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="288,85 279.9,88.9 279.9,81.1" fill="#173f58"/><rect x="290" y="60" width="125" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="352.5" y="89" text-anchor="middle" font-size="10" font-weight="600" fill="#173f58">alarme à 1 000 000</text><polyline points="415,85 428,85" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="428,85 419.9,88.9 419.9,81.1" fill="#173f58"/><rect x="430" y="60" width="125" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="492.5" y="89" text-anchor="middle" font-size="10" font-weight="600" fill="#173f58">ISR chaque seconde</text></svg>
