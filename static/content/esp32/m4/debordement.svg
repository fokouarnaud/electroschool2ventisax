<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Un compteur de 32 bits revient à 0 après 4 294 967 295 ms, soit environ 49,7 jours</title><rect width="560" height="170" rx="14" fill="#fcfefe"/><polyline points="60,130 420,40" fill="none" stroke="#0d665e" stroke-width="3" stroke-linejoin="round"/><polyline points="420,40 420,130" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polyline points="420,130 500,110" fill="none" stroke="#0d665e" stroke-width="3" stroke-linejoin="round"/><text x="280" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">4 294 967 295 ms ≈ 49,7 jours, puis retour à 0</text></svg>
