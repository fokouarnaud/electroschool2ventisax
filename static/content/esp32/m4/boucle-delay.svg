<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Une boucle qui appelle delay passe presque tout son temps à attendre</title><rect width="560" height="160" rx="14" fill="#fcfefe"/><rect x="20" y="50" width="120" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="80" y="76" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">lecture du bouton</text><rect x="170" y="50" width="360" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="350" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">delay(500)</text><text x="280" y="130" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">loop() bloquée pendant delay</text></svg>
