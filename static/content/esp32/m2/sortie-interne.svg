<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Dans la puce, une sortie relie la broche soit au 3,3 V, soit à GND, par deux interrupteurs dont un seul est fermé</title><rect width="520" height="240" rx="14" fill="#fcfefe"/><text x="200" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">3,3 V</text><polyline points="200,35 200,60" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(200,60) rotate(90)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="7" y2="0"/><line x1="43" y1="0" x2="50" y2="0"/><g transform="translate(7,0)"><circle cx="2" cy="0" r="2.5" fill="#173f58"/><circle cx="34" cy="0" r="2.5" fill="#173f58"/><line x1="2" y1="0" x2="34" y2="0"/></g></g><text x="182" y="83" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">HIGH : vers 3,3 V</text><polyline points="200,110 200,130" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><circle cx="200" cy="120" r="3.5" fill="#173f58"/><polyline points="200,120 379,120" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><circle cx="384" cy="120" r="5" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="396" y="125" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">broche</text><g transform="translate(200,130) rotate(90)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="7" y2="0"/><line x1="43" y1="0" x2="50" y2="0"/><g transform="translate(7,0)"><circle cx="2" cy="0" r="2.5" fill="#173f58"/><circle cx="34" cy="0" r="2.5" fill="#173f58"/><line x1="2" y1="0" x2="32" y2="-14"/></g></g><text x="182" y="153" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">LOW : vers GND</text><polyline points="200,180 200,195" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline 