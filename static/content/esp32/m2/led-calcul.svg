<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" width="520" height="190" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Partage de la tension : sur 3,3 V, la LED rouge garde 2,0 V et la résistance reçoit le reste, 1,3 V</title><rect width="520" height="190" rx="14" fill="#fcfefe"/><rect x="60" y="60" width="160" height="40" fill="#c9d8dd" stroke="#173f58" stroke-width="1.5"/><rect x="220" y="60" width="246" height="40" fill="#0d665e" stroke="#173f58" stroke-width="1.5"/><text x="140" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">1,3 V</text><text x="343" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#fcfefe">2,0 V</text><text x="140" y="125" text-anchor="middle" font-size="11" font-weight="400" fill="#173f58">aux bornes de R</text><text x="343" y="125" text-anchor="middle" font-size="11" font-weight="400" fill="#173f58">aux bornes de la LED</text><text x="263" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">3,3 V</text><text x="263" y="165" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">R = 1,3 V / 4 mA ≈ 325 Ω, on choisit 330 Ω</text></svg>
