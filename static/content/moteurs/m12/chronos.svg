<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Chronogrammes des temporisations : TON retarde la montée, TOF retarde la descente, TP donne une impulsion de durée fixe</title><rect width="560" height="260" rx="14" fill="#fcfefe"/><text x="130" y="34" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">IN</text><polyline points="140,40 520,40" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><polyline points="140,40 178,40 178,18 368,18 368,40 520,40" fill="none" stroke="#173f58" stroke-width="2.5" stroke-linejoin="round"/><text x="130" y="84" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">TON : Q</text><polyline points="140,90 520,90" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><polyline points="140,90 254,90 254,68 368,68 368,90 520,90" fill="none" stroke="#0d665e" stroke-width="2.5" stroke-linejoin="round"/><text x="130" y="134" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">TOF : Q</text><polyline points="140,140 520,140" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><polyline points="140,140 178,140 178,118 444,118 444,140 520,140" fill="none" stroke="#0d665e" stroke-width="2.5" stroke-linejoin="round"/><text x="130" y="184" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">TP : Q</text><polyline points="140,190 520,190" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><polyline points="140,190 178,190 178,168 254,168 254,190 520,190" fill="none" stroke="#0d665e" stroke-width="2.5" stroke-linejoin="round"/><line x1="178" y1="10" x2="178" y2="216" stroke="#7d93a0" stroke-dasharray="4 3"/><text x="178" y="232" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">0</text><line x1="254" y1="10" x2="254" y2="216" stroke="#7d93a0" stroke-dasharray="4 3"/><text x="254" y="232" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">PT</text><line x1="368" y1="10" x2="368" y2="216" stroke="#7d93a0" stroke-dasharray="4 3"/><text x="368" y="232" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">IN à 0</text><line x1="444" y1="10" x2="444" y2="216" stroke="#7d93a0" stroke-dasharray="4 3"/><text x="444" y="232" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">+ PT</text></svg>
