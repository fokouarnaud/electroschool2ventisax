<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Lire une adresse IEC : % marque une variable directe, I entrée (Q sortie, M mémoire), X un bit, puis le numéro de l'octet et du bit</title><rect width="560" height="210" rx="14" fill="#fcfefe"/><text x="70" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#0d665e">%</text><text x="70" y="130" text-anchor="middle" font-size="11" font-weight="400" fill="#173f58">variable directe</text><text x="152" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#0d665e">I</text><text x="152" y="130" text-anchor="middle" font-size="11" font-weight="400" fill="#173f58">entrée</text><text x="234" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#0d665e">X</text><text x="234" y="130" text-anchor="middle" font-size="11" font-weight="400" fill="#173f58">bit</text><text x="316" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#0d665e">0</text><text x="316" y="130" text-anchor="middle" font-size="11" font-weight="400" fill="#173f58">octet 0</text><text x="398" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#173f58">.</text><text x="480" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#0d665e">1</text><text x="480" y="130" text-anchor="middle" font-size="11" font-weight="400" fill="#173f58">bit 1</text><text x="280" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">%IX0.1 : le deuxième bit de l'octet d'entrées 0</text></svg>
