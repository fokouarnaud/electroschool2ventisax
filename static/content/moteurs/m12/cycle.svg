<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Cycle d'un automate : il lit toutes ses entrées, exécute le programme, puis écrit toutes ses sorties, et recommence, en quelques millisecondes</title><rect width="520" height="260" rx="14" fill="#fcfefe"/><rect x="170" y="25" width="180" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="260" y="49" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">1. lire les entrées</text><rect x="48.8" y="160" width="180" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="138.8" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">2. exécuter le programme</text><rect x="291.2" y="160" width="180" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="381.2" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">3. écrire les sorties</text><path d="M330 60 A140 90 0 0 1 380 190" fill="none" stroke="#0d665e" stroke-width="2"/><text x="260" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">un tour = le temps de cycle, quelques ms</text></svg>
