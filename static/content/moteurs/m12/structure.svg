<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Structure d'un automate : alimentation, unité centrale avec sa mémoire, cartes d'entrées et de sorties, communication</title><rect width="600" height="230" rx="14" fill="#fcfefe"/><rect x="220" y="70" width="160" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="300" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">unité centrale + mémoire</text><rect x="20" y="70" width="150" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="95" y="104" text-anchor="middle" font-size="10" font-weight="600" fill="#173f58">entrées (capteurs, boutons)</text><rect x="430" y="70" width="150" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="505" y="104" text-anchor="middle" font-size="10" font-weight="600" fill="#173f58">sorties (bobines, voyants)</text><rect x="220" y="160" width="160" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="300" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">alimentation 24 V</text><rect x="220" y="10" width="160" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="300" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">communication</text><polyline points="170,100 220,100" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="220,100 211.9,103.9 211.9,96.1" fill="#173f58"/><polyline points="380,100 430,100" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="430,100 421.9,103.9 421.9,96.1" fill="#173f58"/></svg>
