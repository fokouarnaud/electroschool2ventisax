<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Triangle des puissances : P active, Q réactive, S apparente ; cos φ = P / S</title><rect width="520" height="270" rx="14" fill="#fcfefe"/><polyline points="80,210 400,210" fill="none" stroke="#0d665e" stroke-width="3" stroke-linejoin="round"/><polyline points="400,210 400,60" fill="none" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><polyline points="80,210 400,60" fill="none" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><text x="240" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#0d665e">P (active, kW)</text><text x="412" y="140" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">Q (réactive, kvar)</text><text x="200" y="118" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">S (apparente, kVA)</text><path d="M140 210 A60 60 0 0 0 134 185" fill="none" stroke="#0d665e" stroke-width="2"/><text x="150" y="196" text-anchor="start" font-size="13" font-weight="700" fill="#0d665e">φ</text><text x="260" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">S² = P² + Q²   cos φ = P / S</text></svg>
