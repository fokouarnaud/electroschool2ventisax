<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Centre de commande des moteurs : un jeu de barres alimente des tiroirs, chacun équipé d'un départ moteur complet</title><rect width="520" height="280" rx="14" fill="#fcfefe"/><rect x="80" y="20" width="360" height="240" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><polyline points="100,40 100,240" fill="none" stroke="#0d665e" stroke-width="5" stroke-linejoin="round"/><text x="112" y="34" text-anchor="start" font-size="11" font-weight="600" fill="#0d665e">jeu de barres</text><rect x="140" y="50" width="270" height="40" rx="5" fill="#fcfefe" stroke="#173f58" stroke-width="1.5"/><text x="160" y="75" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">tiroir 1 : Q, KM, F → M1</text><polyline points="100,70 140,70" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="140" y="100" width="270" height="40" rx="5" fill="#fcfefe" stroke="#173f58" stroke-width="1.5"/><text x="160" y="125" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">tiroir 2 : Q, KM, F → M2</text><polyline points="100,120 140,120" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="140" y="150" width="270" height="40" rx="5" fill="#fcfefe" stroke="#173f58" stroke-width="1.5"/><text x="160" y="175" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">tiroir 3 : Q, KM, F → M3</text><polyline points="100,170 140,170" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="140" y="200" width="270" height="40" rx="5" fill="#fcfefe" stroke="#173f58" stroke-width="1.5"/><text x="160" y="225" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">tiroir 4 : Q, KM, F → M4</text><polyline points="100,220 140,220" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="260" y="275" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">centre de commande des moteurs</text></svg>
