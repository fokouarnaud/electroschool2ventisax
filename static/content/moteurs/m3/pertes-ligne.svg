<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Pertes en ligne pour transporter 100 kW, 0,1 Ω par conducteur : 6,25 kW en 400 V, 2,5 W en 20 kV</title><rect width="560" height="210" rx="14" fill="#fcfefe"/><rect x="120" y="36" width="306.9" height="41" rx="4" fill="#0d665e" opacity="0.68"/><text x="112" y="61.5" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">400 V</text><text x="434.9" y="61.5" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">6,25 kW</text><rect x="120" y="91" width="89.5" height="41" rx="4" fill="#0d665e" opacity="1.00"/><text x="112" y="116.5" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">20 kV</text><text x="217.5" y="116.5" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">2,5 W</text><text x="280" y="158" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">pertes en ligne (3 × R × I²) pour 100 kW</text><text x="280" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">I = P / (√3 × U) : 144 A en 400 V, 2,9 A en 20 kV</text></svg>
