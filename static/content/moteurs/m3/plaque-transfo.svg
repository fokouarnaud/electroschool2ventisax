<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Plaque d'un transformateur de distribution : 630 kVA, 20 kV / 410 V, couplage Dyn11, tension de court-circuit 4 %</title><rect width="540" height="250" rx="14" fill="#fcfefe"/><rect x="40" y="20" width="460" height="210" rx="12" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="270" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">TRANSFORMATEUR TRIPHASÉ</text><text x="70" y="90" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">630 kVA</text><text x="470" y="90" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">50 Hz</text><polyline points="60,102 480,102" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="126" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">20 kV / 410 V</text><text x="470" y="126" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">18,2 A / 887 A</text><polyline points="60,138 480,138" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="162" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">Dyn11</text><text x="470" y="162" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">ucc 4 %</text><polyline points="60,174 480,174" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="198" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">pertes à vide 1 kW</text><text x="470" y="198" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">pertes en charge 6,5 kW</text><polyline points="60,210 480,210" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/></svg>
