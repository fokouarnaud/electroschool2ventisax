<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Relais bistable à deux bobines : une impulsion sur la bobine S enclenche, une impulsion sur la bobine R déclenche ; l'état est mémorisé sans courant</title><rect width="520" height="220" rx="14" fill="#fcfefe"/><polyline points="100,60 100,72" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="100,92 100,104" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="84" y="72" width="32" height="20" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="80" y="69" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">A1</text><text x="80" y="103" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">A2</text><text x="122" y="87" text-anchor="start" font-size="13" font-weight="600" fill="#0d665e">S</text><polyline points="220,60 220,72" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="220,92 220,104" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><rect x="204" y="72" width="32" height="20" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="200" y="69" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">A1</text><text x="200" y="103" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">A2</text><text x="242" y="87" text-anchor="start" font-size="13" font-weight="600" fill="#0d665e">R</text><polyline points="380,60 380,74" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="380,90 380,104" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="380,90 368,72" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="396" y="86" text-anchor="start" font-size="13" font-weight="600" fill="#0d665e">KA1</text><text x="160" y="160" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">mise en marche / arrêt</text><text x="380" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">état mémorisé</text><text x="260" y="200" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">consommation nulle entre deux impulsions</text></svg>
