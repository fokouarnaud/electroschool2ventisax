<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Données d'un contacteur : courant et puissance en AC-3 sous 400 V, courant thermique Ith en AC-1, tension de la bobine</title><rect width="560" height="240" rx="14" fill="#fcfefe"/><rect x="40" y="20" width="480" height="200" rx="12" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="280" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">CONTACTEUR KM1</text><text x="70" y="84" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">AC-3, 400 V</text><text x="490" y="84" text-anchor="end" font-size="13" font-weight="400" fill="#173f58">9 A, 4 kW</text><polyline points="60,94 500,94" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="114" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">AC-1</text><text x="490" y="114" text-anchor="end" font-size="13" font-weight="400" fill="#173f58">Ith 25 A</text><polyline points="60,124 500,124" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="144" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">bobine</text><text x="490" y="144" text-anchor="end" font-size="13" font-weight="400" fill="#173f58">24 V CC</text><polyline points="60,154 500,154" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="174" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">auxiliaires</text><text x="490" y="174" text-anchor="end" font-size="13" font-weight="400" fill="#173f58">1 F + 1 O</text><polyline points="60,184 500,184" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="204" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">durée de vie</text><text x="490" y="204" text-anchor="end" font-size="13" font-weight="400" fill="#173f58">1 million de manœuvres en AC-3</text><polyline points="60,214 500,214" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/></svg>
