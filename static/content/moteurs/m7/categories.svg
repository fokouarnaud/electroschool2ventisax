<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Catégories d'emploi en alternatif : AC-1 charges résistives, AC-3 moteurs à cage coupés en marche, AC-4 inversion et marche par à-coups</title><rect width="600" height="250" rx="14" fill="#fcfefe"/><rect x="20" y="26" width="110" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="75" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">AC-1</text><text x="150" y="51" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">charges peu inductives : chauffage, éclairage</text><rect x="20" y="78" width="110" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="75" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">AC-3</text><text x="150" y="103" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">moteur à cage : démarrage, coupure moteur lancé</text><rect x="20" y="130" width="110" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="75" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">AC-4</text><text x="150" y="155" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">moteur à cage : inversion, à-coups, freinage par contre-courant</text><rect x="20" y="182" width="110" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="75" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">DC-1, DC-3</text><text x="150" y="207" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">équivalents en courant continu</text></svg>
