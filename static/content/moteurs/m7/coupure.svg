<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Courant que le contacteur doit couper : environ In en AC-3, mais jusqu'à 6 In en AC-4, d'où une usure bien plus rapide</title><rect width="560" height="210" rx="14" fill="#fcfefe"/><rect x="180" y="26" width="50" height="41" rx="4" fill="#0d665e" opacity="0.68"/><text x="172" y="51.5" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">AC-3 (moteur lancé)</text><text x="238" y="51.5" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ In</text><rect x="180" y="81" width="300" height="41" rx="4" fill="#0d665e" opacity="1.00"/><text x="172" y="106.5" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">AC-4 (moteur au démarrage)</text><text x="488" y="106.5" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 6 In</text><text x="330" y="148" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">courant à couper</text><text x="280" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">même contacteur : moins de manœuvres en AC-4</text></svg>
