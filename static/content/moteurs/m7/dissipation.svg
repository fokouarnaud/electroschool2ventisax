<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="520" height="210" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Échauffement d'un contacteur statique : environ 1,5 W par ampère et par phase, à évacuer par le dissipateur</title><rect width="520" height="210" rx="14" fill="#fcfefe"/><rect x="170" y="26" width="105" height="46" rx="4" fill="#0d665e" opacity="0.68"/><text x="162" y="54" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">10 A, 3 phases</text><text x="283" y="54" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">45 W</text><rect x="170" y="86" width="262.5" height="46" rx="4" fill="#0d665e" opacity="1.00"/><text x="162" y="114" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">25 A, 3 phases</text><text x="440.5" y="114" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">112,5 W</text><text x="310" y="158" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">P ≈ 1,5 V × I × 3</text><text x="260" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">aucune usure mécanique, mais de la chaleur</text></svg>
