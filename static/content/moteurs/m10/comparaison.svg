<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Choisir un composant de puissance : MOSFET pour les basses tensions et hautes fréquences, IGBT pour les variateurs, thyristor pour les très fortes puissances</title><rect width="600" height="230" rx="14" fill="#fcfefe"/><rect x="20" y="30" width="120" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="80" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">MOSFET</text><text x="160" y="48" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">jusqu'à quelques centaines de V</text><text x="160" y="68" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">très rapide</text><rect x="20" y="92" width="120" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="80" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">IGBT</text><text x="160" y="110" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">600 à 1 700 V</text><text x="160" y="130" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">rapide : variateurs</text><rect x="20" y="154" width="120" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="80" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">thyristor</text><text x="160" y="172" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">jusqu'à plusieurs kV</text><text x="160" y="192" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">lent : 50 Hz, ne s'éteint pas seul</text></svg>
