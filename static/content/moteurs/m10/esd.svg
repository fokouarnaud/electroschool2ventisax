<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Décharges électrostatiques : un composant peut être détruit par une décharge invisible ; bracelet relié à la terre, tapis antistatique, sachet blindé</title><rect width="560" height="220" rx="14" fill="#fcfefe"/><rect x="20" y="70" width="160" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="100" y="99" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">bracelet relié à la terre</text><rect x="200" y="70" width="160" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="280" y="99" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">tapis antistatique</text><rect x="380" y="70" width="160" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="460" y="99" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">sachet blindé</text><text x="280" y="170" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">une décharge de quelques milliers de volts passe inaperçue</text><text x="280" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">mais suffit à détruire la grille d'un MOSFET ou d'un IGBT</text></svg>
