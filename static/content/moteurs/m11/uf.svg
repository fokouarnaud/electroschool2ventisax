<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Loi U/f : la tension varie proportionnellement à la fréquence jusqu'à 400 V à 50 Hz, pour garder le flux du moteur constant ; au-delà, la tension plafonne</title><rect width="520" height="270" rx="14" fill="#fcfefe"/><polyline points="66,220 464,220" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="464,220 455.9,223.9 455.9,216.1" fill="#173f58"/><polyline points="70,224 70,16" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="70,16 73.9,24.1 66.1,24.1" fill="#173f58"/><text x="464" y="210" text-anchor="end" font-size="12" font-weight="400" fill="#173f58">fréquence (Hz)</text><text x="78" y="26" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">tension (V)</text><polyline points="205.7,217 205.7,223" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="205.7" y="236" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">25</text><polyline points="341.4,217 341.4,223" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="341.4" y="236" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">50</text><polyline points="67,135.6 73,135.6" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="64" y="139.6" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">200</text><polyline points="67,51.1 73,51.1" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="64" y="55.1" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">400</text><polyline points="70,220 341.4,51.1 450,51.1" fill="none" stroke="#0d665e" stroke-width="2.5" stroke-linejoin="round"/><line x1="205.7" y1="135.6" x2="205.7" y2="220" stroke="#7d93a0" stroke-dasharray="4 3"/><text x="211.7" y="129.6" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">25 Hz : 200 V</text><line x1="341.4" y1="51.1" x2="341.4" y2="220" stroke="#7d93a0" stroke-dasharray="4 3"/><text x="347.4" y="45.1" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">50 Hz : 400 V</text></svg>
