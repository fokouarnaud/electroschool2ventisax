<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Compatibilité électromagnétique : blindage du câble moteur relié à la terre sur toute sa circonférence aux deux bouts, câbles de puissance et de commande séparés</title><rect width="560" height="230" rx="14" fill="#fcfefe"/><rect x="40" y="60" width="200" height="30" rx="15" fill="#7d93a0"/><rect x="40" y="66" width="200" height="18" rx="9" fill="#dfe8ea"/><text x="140" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">câble moteur blindé</text><rect x="28" y="56" width="16" height="38" fill="#0d665e"/><rect x="236" y="56" width="16" height="38" fill="#0d665e"/><text x="140" y="120" text-anchor="middle" font-size="12" font-weight="400" fill="#0d665e">blindage repris à 360° aux deux bouts</text><polyline points="320,70 520,70" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="320,150 520,150" fill="none" stroke="#7d93a0" stroke-width="2" stroke-linejoin="round"/><polyline points="420,80 420,140" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="420,140 416.1,131.9 423.9,131.9" fill="#173f58"/><text x="454" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">≥ 30 cm</text><text x="420" y="60" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">puissance</text><text x="420" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">commande</text></svg>
