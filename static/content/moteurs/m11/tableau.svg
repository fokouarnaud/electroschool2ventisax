<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Fiche de paramétrage du mini-projet : on reporte la plaque d'un vrai moteur, puis on choisit rampes et limites</title><rect width="560" height="240" rx="14" fill="#fcfefe"/><rect x="40" y="20" width="480" height="200" rx="10" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="70" y="52" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">tension du moteur</text><polyline points="330,56 490,56" fill="none" stroke="#7d93a0" stroke-width="1.5" stroke-linejoin="round"/><text x="70" y="80" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">courant du moteur</text><polyline points="330,84 490,84" fill="none" stroke="#7d93a0" stroke-width="1.5" stroke-linejoin="round"/><text x="70" y="108" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">fréquence</text><polyline points="330,112 490,112" fill="none" stroke="#7d93a0" stroke-width="1.5" stroke-linejoin="round"/><text x="70" y="136" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">vitesse</text><polyline points="330,140 490,140" fill="none" stroke="#7d93a0" stroke-width="1.5" stroke-linejoin="round"/><text x="70" y="164" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">rampe d'accélération</text><polyline points="330,168 490,168" fill="none" stroke="#7d93a0" stroke-width="1.5" stroke-linejoin="round"/><text x="70" y="192" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">rampe de décélération</text><polyline points="330,196 490,196" fill="none" stroke="#7d93a0" stroke-width="1.5" stroke-linejoin="round"/></svg>
