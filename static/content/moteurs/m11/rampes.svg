<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Rampes : le variateur accélère le moteur en 5 s jusqu'à 50 Hz et le ralentit en 3 s, au lieu d'un démarrage et d'un arrêt brusques</title><rect width="540" height="260" rx="14" fill="#fcfefe"/><polyline points="66,210 484,210" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="484,210 475.9,213.9 475.9,206.1" fill="#173f58"/><polyline points="70,214 70,16" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="70,16 73.9,24.1 66.1,24.1" fill="#173f58"/><text x="484" y="200" text-anchor="end" font-size="12" font-weight="400" fill="#173f58">temps (s)</text><text x="78" y="26" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">fréquence (Hz)</text><polyline points="170,207 170,213" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="170" y="226" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">5</text><polyline points="350,207 350,213" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="350" y="226" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">14</text><polyline points="410,207 410,213" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="410" y="226" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">17</text><polyline points="67,60 73,60" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="64" y="64" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">50</text><polyline points="70,210 170,60 350,60 410,210 470,210" fill="none" stroke="#0d665e" stroke-width="2.5" stroke-linejoin="round"/><text x="130" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">accélération 5 s</text><text x="420" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">décélération 3 s</text></svg>
