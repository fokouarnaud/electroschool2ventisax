<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="520" height="230" rx="14" fill="#fcfefe"/><rect x="170" y="26" width="260" height="26" rx="4" fill="#0d665e" opacity="0.51"/><text x="162" y="44" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">p = 1 (2 poles)</text><text x="438" y="44" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">3000 rpm</text><rect x="170" y="66" width="130" height="26" rx="4" fill="#0d665e" opacity="0.68"/><text x="162" y="84" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">p = 2 (4 poles)</text><text x="308" y="84" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">1500 rpm</text><rect x="170" y="106" width="86.7" height="26" rx="4" fill="#0d665e" opacity="0.84"/><text x="162" y="124" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">p = 3 (6 poles)</text><text x="264.7" y="124" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">1000 rpm</text><rect x="170" y="146" width="65" height="26" rx="4" fill="#0d665e" opacity="1.00"/><text x="162" y="164" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">p = 4 (8 poles)</text><text x="243" y="164" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">750 rpm</text><text x="300" y="198" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">ns = 60 × f / p</text></svg>
