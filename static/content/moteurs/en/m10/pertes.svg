<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="560" height="230" rx="14" fill="#fcfefe"/><rect x="40" y="40" width="220" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="150" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">off</text><text x="150" y="112" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">U = 12 V</text><text x="150" y="136" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">I = 0 A</text><text x="150" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#0d665e">P = U × I = 0 W</text><rect x="300" y="40" width="220" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="410" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">saturated</text><text x="410" y="112" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">U = 0.1 V</text><text x="410" y="136" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">I = 2 A</text><text x="410" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#0d665e">P = U × I = 0.2 W</text><text x="280" y="212" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">at 12 V and 2 A, the load gets 24 W; the transistor loses 0.2</text></svg>
