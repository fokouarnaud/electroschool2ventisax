<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="600" height="240" rx="14" fill="#fcfefe"/><rect x="20" y="20" width="160" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="100" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">overcurrent</text><text x="200" y="45" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">ramp too short, motor short circuit</text><rect x="20" y="72" width="160" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="100" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">DC bus overvoltage</text><text x="200" y="97" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">deceleration too fast: a braking resistor is needed</text><rect x="20" y="124" width="160" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="100" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">undervoltage</text><text x="200" y="149" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">weak supply or outage</text><rect x="20" y="176" width="160" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="100" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">overheating</text><text x="200" y="201" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">blocked ventilation, room too hot</text></svg>
