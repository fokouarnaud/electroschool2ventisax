<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="560" height="290" rx="14" fill="#fcfefe"/><rect x="40" y="20" width="480" height="250" rx="12" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="70" y="50" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">motor rated voltage</text><text x="490" y="50" text-anchor="end" font-size="12" font-weight="700" fill="#0d665e">400 V</text><polyline points="60,58 500,58" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="78" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">motor rated current</text><text x="490" y="78" text-anchor="end" font-size="12" font-weight="700" fill="#0d665e">4.8 A</text><polyline points="60,86 500,86" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="106" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">rated frequency</text><text x="490" y="106" text-anchor="end" font-size="12" font-weight="700" fill="#0d665e">50 Hz</text><polyline points="60,114 500,114" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="134" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">rated speed</text><text x="490" y="134" text-anchor="end" font-size="12" font-weight="700" fill="#0d665e">1440 rpm</text><polyline points="60,142 500,142" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="162" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">acceleration time</text><text x="490" y="162" text-anchor="end" font-size="12" font-weight="700" fill="#173f58">5 s</text><polyline points="60,170 500,170" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="190" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">deceleration time</text><text x="490" y="190" text-anchor="end" font-size="12" font-weight="700" fill="#173f58">3 s</text><polyline points="60,198 500,198" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="218" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">minimum frequency</text><text x="490" y="218" text-anchor="end" font-size="12" font-weight="700" fill="#173f58">10 Hz</text><polyline points="60,226 500,226" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/><text x="70" y="246" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">maximum frequency</text><text x="490" y="246" text-anchor="end" font-size="12" font-weight="700" fill="#173f58">50 Hz</text><polyline points="60,254 500,254" fill="none" stroke="#7d93a0" stroke-width="1" stroke-linejoin="round"/></svg>
