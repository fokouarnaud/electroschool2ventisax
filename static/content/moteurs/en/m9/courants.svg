<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="560" height="230" rx="14" fill="#fcfefe"/><rect x="200" y="26" width="260" height="32.7" rx="4" fill="#0d665e" opacity="0.57"/><text x="192" y="47.3" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">direct-on-line</text><text x="468" y="47.3" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 7 In</text><rect x="200" y="72.7" width="86.7" height="32.7" rx="4" fill="#0d665e" opacity="0.78"/><text x="192" y="94" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">star-delta</text><text x="294.7" y="94" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 2.3 In</text><rect x="200" y="119.3" width="111.4" height="32.7" rx="4" fill="#0d665e" opacity="1.00"/><text x="192" y="140.7" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">soft starter</text><text x="319.4" y="140.7" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 3 In (adjustable)</text><text x="330" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">starting current (× In)</text><text x="280" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">in star, the starting torque is also divided by 3</text></svg>
