<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="560" height="290" rx="14" fill="#fcfefe"/><polyline points="80,250 340,250" fill="none" stroke="#0d665e" stroke-width="3" stroke-linejoin="round"/><text x="210" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#0d665e">P = 100 kW</text><polyline points="340,250 340,55" fill="none" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><polyline points="80,250 340,55" fill="none" stroke="#7d93a0" stroke-width="2" stroke-linejoin="round"/><polyline points="80,250 340,164.2" fill="none" stroke="#173f58" stroke-width="3" stroke-linejoin="round"/><text x="352" y="94" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">before: Q = 75 kvar</text><text x="352" y="203.2" text-anchor="start" font-size="12" font-weight="600" fill="#173f58">after: Q = 33 kvar</text><line x1="346" y1="55" x2="346" y2="164.2" stroke="#0d665e" stroke-width="4"/><text x="330" y="109.6" text-anchor="end" font-size="13" font-weight="700" fill="#0d665e">Qc</text><text x="280" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">Qc = P × (tan φ1 − tan φ2) ≈ 42 kvar</text><text x="150" y="196" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">cos φ 0.8</text><text x="200" y="232" text-anchor="middle" font-size="11" font-weight="400" fill="#0d665e">cos φ 0.95</text></svg>
