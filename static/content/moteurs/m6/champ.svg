<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Trois bobines décalées de 120°, alimentées en triphasé, créent un champ magnétique qui tourne</title><rect width="520" height="260" rx="14" fill="#fcfefe"/><circle cx="160" cy="40" r="22" fill="#c9d8dd" stroke="#173f58" stroke-width="2"/><text x="160" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">U</text><circle cx="237.9" cy="175" r="22" fill="#c9d8dd" stroke="#173f58" stroke-width="2"/><text x="237.9" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">V</text><circle cx="82.1" cy="175" r="22" fill="#c9d8dd" stroke="#173f58" stroke-width="2"/><text x="82.1" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">W</text><path d="M160 70 A60 60 0 1 1 103 150" fill="none" stroke="#0d665e" stroke-width="3"/><polyline points="112,160 100,148" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="100,148 108.5,151 103,156.5" fill="#0d665e"/><text x="340" y="110" text-anchor="start" font-size="13" font-weight="700" fill="#0d665e">champ tournant</text><text x="340" y="140" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">à 50 Hz : 3 000 tr/min</text><text x="340" y="165" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">pour une paire de pôles</text></svg>
