<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Contrôle d'un moteur débranché : barrettes retirées, les trois enroulements doivent présenter la même résistance</title><rect width="520" height="230" rx="14" fill="#fcfefe"/><text x="60" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">U1</text><polyline points="80,50 120,50" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(120,50) rotate(0)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="20" y2="0"/><line x1="60" y1="0" x2="80" y2="0"/><g transform="translate(20,0)"><path d="M0 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0"/></g></g><polyline points="200,50 240,50" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="260" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">U2</text><text x="330" y="55" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 2,7 Ω</text><text x="60" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">V1</text><polyline points="80,110 120,110" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(120,110) rotate(0)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="20" y2="0"/><line x1="60" y1="0" x2="80" y2="0"/><g transform="translate(20,0)"><path d="M0 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0"/></g></g><polyline points="200,110 240,110" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="260" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">V2</text><text x="330" y="115" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 2,7 Ω</text><text x="60" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">W1</text><polyline points="80,170 120,170" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(120,170) rotate(0)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="20" y2="0"/><line x1="60" y1="0" x2="80" y2="0"/><g transform="translate(20,0)"><path d="M0 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0"/></g></g><polyline points="200,170 240,170" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="260" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">W2</text><text x="330" y="175" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 2,7 Ω</text><text x="260" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">trois valeurs égales à quelques % près</text></svg>
