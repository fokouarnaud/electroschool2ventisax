<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Moteur synchrone : sa vitesse reste égale à la vitesse de synchronisme quelle que soit la charge</title><rect width="520" height="250" rx="14" fill="#fcfefe"/><polyline points="66,200 464,200" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="464,200 455.9,203.9 455.9,196.1" fill="#173f58"/><polyline points="70,204 70,16" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="70,16 73.9,24.1 66.1,24.1" fill="#173f58"/><text x="464" y="190" text-anchor="end" font-size="12" font-weight="400" fill="#173f58">charge (× nominale)</text><text x="78" y="26" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">vitesse (tr/min)</text><polyline points="386.7,197 386.7,203" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="386.7" y="216" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">1</text><polyline points="67,86.7 73,86.7" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="64" y="90.7" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">1500</text><polyline points="67,132 73,132" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="64" y="136" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">1420</text><polyline points="70,86.7 418.3,86.7" fill="none" stroke="#0d665e" stroke-width="2.5" stroke-linejoin="round"/><text x="117.5" y="75.3" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">synchrone</text><polyline points="70,89.5 418.3,132" fill="none" stroke="#7d93a0" stroke-width="2.5" stroke-linejoin="round"/><text x="244.2" y="140.5" text-anchor="start" font-size="12" font-weight="600" fill="#7d93a0">asynchrone</text></svg>
