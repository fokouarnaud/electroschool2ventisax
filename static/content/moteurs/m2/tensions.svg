<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Choisir le couplage : un enroulement supporte 230 V ; sur un réseau 400 V on couple en étoile, sur 230 V en triangle</title><rect width="560" height="210" rx="14" fill="#fcfefe"/><rect x="150" y="20" width="260" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="280" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#173f58">tension supportée par un enroulement : 230 V</text><polyline points="280,64 280,84 150,84 150,110" fill="none" stroke="#7d93a0" stroke-width="2" stroke-linejoin="round"/><polyline points="280,84 410,84 410,110" fill="none" stroke="#7d93a0" stroke-width="2" stroke-linejoin="round"/><rect x="40" y="110" width="220" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="150" y="139" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">réseau 400 V → étoile</text><rect x="300" y="110" width="220" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="410" y="139" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">réseau 230 V → triangle</text><text x="150" y="190" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">230/400 V : Δ sur 230 V, Y sur 400 V</text><text x="410" y="190" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">400/690 V : Δ sur 400 V</text></svg>
