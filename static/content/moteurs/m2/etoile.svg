<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Couplage étoile : une barrette relie W2, U2 et V2 ; chaque enroulement reçoit 400 / √3 = 230 V</title><rect width="480" height="250" rx="14" fill="#fcfefe"/><circle cx="180" cy="70" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><circle cx="180" cy="140" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="180" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#173f58">U1</text><text x="180" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#173f58">W2</text><circle cx="240" cy="70" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><circle cx="240" cy="140" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="240" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#173f58">V1</text><text x="240" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#173f58">U2</text><circle cx="300" cy="70" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><circle cx="300" cy="140" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="300" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#173f58">W1</text><text x="300" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#173f58">V2</text><rect x="150" y="40" width="180" height="140" rx="10" fill="none" stroke="#173f58" stroke-width="2"/><polyline points="180,140 300,140" fill="none" stroke="#0d665e" stroke-width="6" stroke-linejoin="round"/><text x="240" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">étoile (Y)</text><text x="240" y="212" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">réseau 400 V entre phases</text><text x="240" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">chaque enroulement reçoit 400 / √3 = 230 V</text></svg>
