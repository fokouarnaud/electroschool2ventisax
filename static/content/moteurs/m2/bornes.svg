<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Plaque à bornes d'un moteur triphasé : entrées U1 V1 W1 en haut, sorties W2 U2 V2 décalées en bas</title><rect width="520" height="230" rx="14" fill="#fcfefe"/><circle cx="160" cy="60" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><circle cx="160" cy="140" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="160" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">U1</text><text x="160" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">W2</text><circle cx="260" cy="60" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><circle cx="260" cy="140" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="260" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">V1</text><text x="260" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">U2</text><circle cx="360" cy="60" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><circle cx="360" cy="140" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="360" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">W1</text><text x="360" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">V2</text><rect x="130" y="30" width="260" height="150" rx="10" fill="none" stroke="#173f58" stroke-width="2"/><text x="260" y="212" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">plaque à bornes : entrées U1 V1 W1, sorties décalées W2 U2 V2</text></svg>
