<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Frein électromécanique à manque de courant : des ressorts serrent le frein ; la bobine alimentée le desserre ; coupure de courant = freinage</title><rect width="520" height="230" rx="14" fill="#fcfefe"/><rect x="60" y="80" width="120" height="70" rx="6" fill="#c9d8dd" stroke="#173f58" stroke-width="2"/><text x="120" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">moteur</text><rect x="200" y="70" width="20" height="90" fill="#173f58"/><rect x="240" y="70" width="60" height="90" fill="#fcfefe" stroke="#0d665e" stroke-width="3"/><path d="M320 100 l10 -6 l-10 -6 l10 -6 l-10 -6" fill="none" stroke="#173f58" stroke-width="2"/><text x="270" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">bobine du frein</text><text x="340" y="92" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">ressorts</text><text x="210" y="60" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">disque</text><text x="260" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">sans courant, le frein serre : sécurité en cas de coupure</text></svg>
