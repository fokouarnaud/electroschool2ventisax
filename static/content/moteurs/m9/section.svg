<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="540" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Section des conducteurs en cuivre : ordre de grandeur du courant admissible ; la valeur exacte dépend du mode de pose et de la température</title><rect width="540" height="230" rx="14" fill="#fcfefe"/><rect x="120" y="26" width="120" height="23.5" rx="4" fill="#0d665e" opacity="0.51"/><text x="112" y="42.8" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">1,5 mm²</text><text x="248" y="42.8" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 16 A</text><rect x="120" y="63.5" width="157.5" height="23.5" rx="4" fill="#0d665e" opacity="0.68"/><text x="112" y="80.2" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">2,5 mm²</text><text x="285.5" y="80.2" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 21 A</text><rect x="120" y="101" width="210" height="23.5" rx="4" fill="#0d665e" opacity="0.84"/><text x="112" y="117.8" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">4 mm²</text><text x="338" y="117.8" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 28 A</text><rect x="120" y="138.5" width="270" height="23.5" rx="4" fill="#0d665e" opacity="1.00"/><text x="112" y="155.2" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">6 mm²</text><text x="398" y="155.2" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">≈ 36 A</text><text x="270" y="188" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">valeurs indicatives, câble posé sous conduit</text></svg>
