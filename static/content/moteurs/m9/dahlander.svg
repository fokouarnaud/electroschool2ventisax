<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Moteur Dahlander : petite vitesse en triangle sur 1U 1V 1W, grande vitesse en double étoile sur 2U 2V 2W avec 1U 1V 1W reliées</title><rect width="560" height="230" rx="14" fill="#fcfefe"/><rect x="40" y="60" width="220" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="150" y="89" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">petite vitesse (8 pôles)</text><text x="150" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">réseau sur 1U 1V 1W</text><text x="150" y="165" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">2U 2V 2W libres</text><rect x="300" y="60" width="220" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="410" y="89" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">grande vitesse (4 pôles)</text><text x="410" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">réseau sur 2U 2V 2W</text><text x="410" y="165" text-anchor="middle" font-size="12" font-weight="400" fill="#173f58">1U 1V 1W reliées</text><text x="280" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">rapport de vitesse 1 à 2 : 750 et 1 500 tr/min à 50 Hz</text></svg>
