<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Freinage par injection de courant continu : moteur coupé du réseau, on injecte du continu dans deux phases ; le champ fixe freine le rotor</title><rect width="560" height="220" rx="14" fill="#fcfefe"/><rect x="20" y="80" width="115" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="77.5" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">moteur coupé</text><polyline points="135,102 155,102" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="155,102 146.9,105.9 146.9,98.1" fill="#173f58"/><rect x="155" y="80" width="115" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="212.5" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">injection de CC</text><polyline points="270,102 290,102" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="290,102 281.9,105.9 281.9,98.1" fill="#173f58"/><rect x="290" y="80" width="115" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="347.5" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">champ fixe</text><polyline points="405,102 425,102" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="425,102 416.9,105.9 416.9,98.1" fill="#173f58"/><rect x="425" y="80" width="115" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="482.5" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">rotor freiné</text><text x="280" y="180" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">pas de frein mécanique, aucune usure ; pas de maintien à l'arrêt</text></svg>
