<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Moteur pas à pas : 200 pas par tour, soit 1,8° par impulsion ; il avance d'un pas à chaque impulsion</title><rect width="520" height="240" rx="14" fill="#fcfefe"/><circle cx="130" cy="120" r="80" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><polyline points="180,120 200,120" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="173.3,145 190.6,155" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="155,163.3 165,180.6" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="130,170 130,190" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="105,163.3 95,180.6" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="86.7,145 69.4,155" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="80,120 60,120" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="86.7,95 69.4,85" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="105,76.7 95,59.4" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="130,70 130,50" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="155,76.7 165,59.4" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><polyline points="173.3,95 190.6,85" fill="none" stroke="#173f58" stroke-width="4" stroke-linejoin="round"/><circle cx="130" cy="120" r="30" fill="#fcfefe" stroke="#0d665e" stroke-width="3"/><text x="320" y="90" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">360° / 200 pas = 1,8° par pas</text><text x="320" y="130" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">commande par impulsions</text><text x="320" y="160" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">position connue sans capteur</text></svg>
