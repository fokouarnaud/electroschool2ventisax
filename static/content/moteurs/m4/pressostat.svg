<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" width="620" height="270" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Pressostat d'un compresseur : il démarre le moteur sous 4 bar et l'arrête à 6 bar ; l'écart est l'hystérésis</title><rect width="620" height="270" rx="14" fill="#fcfefe"/><polyline points="66,210 464,210" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="464,210 455.9,213.9 455.9,206.1" fill="#173f58"/><polyline points="70,214 70,16" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="70,16 73.9,24.1 66.1,24.1" fill="#173f58"/><text x="464" y="200" text-anchor="end" font-size="12" font-weight="400" fill="#173f58">temps</text><text x="78" y="26" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">pression (bar)</text><polyline points="67,107.1 73,107.1" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="64" y="111.1" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">4</text><polyline points="67,55.7 73,55.7" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="64" y="59.7" text-anchor="end" font-size="11" font-weight="400" fill="#7d93a0">6</text><polyline points="70,55.7 131.3,107.1 143.5,55.7 204.8,107.1 217.1,55.7 278.4,107.1 290.6,55.7 351.9,107.1 364.2,55.7 425.5,107.1 437.7,55.7" fill="none" stroke="#0d665e" stroke-width="2.5" stroke-linejoin="round"/><text x="470" y="64" text-anchor="start" font-size="12" font-weight="600" fill="#173f58">arrêt à 6 bar</text><text x="470" y="116" text-anchor="start" font-size="12" font-weight="600" fill="#173f58">marche à 4 bar</text><text x="260" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">hystérésis : 2 bar</text></svg>
