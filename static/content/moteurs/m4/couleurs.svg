<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Couleurs des boutons et des voyants selon l'IEC 60204-1 : rouge pour l'arrêt d'urgence, blanc ou noir pour marche et arrêt</title><rect width="600" height="250" rx="14" fill="#fcfefe"/><text x="150" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">boutons</text><text x="450" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#173f58">voyants</text><circle cx="60" cy="60" r="15" fill="#c0392b" stroke="#173f58" stroke-width="2"/><text x="88" y="65" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">arrêt d'urgence</text><circle cx="60" cy="104" r="15" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="88" y="109" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">marche (de préférence)</text><circle cx="60" cy="148" r="15" fill="#13212c" stroke="#173f58" stroke-width="2"/><text x="88" y="153" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">arrêt</text><circle cx="60" cy="192" r="15" fill="#e0b100" stroke="#173f58" stroke-width="2"/><text x="88" y="197" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">intervention anormale</text><circle cx="360" cy="60" r="15" fill="#c0392b" stroke="#173f58" stroke-width="2" opacity="0.9"/><text x="388" y="65" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">danger, défaut</text><circle cx="360" cy="104" r="15" fill="#e0b100" stroke="#173f58" stroke-width="2" opacity="0.9"/><text x="388" y="109" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">anormal, attention</text><circle cx="360" cy="148" r="15" fill="#2e8b57" stroke="#173f58" stroke-width="2" opacity="0.9"/><text x="388" y="153" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">normal, en marche</text><circle cx="360" cy="192" r="15" fill="#2f6db5" stroke="#173f58" stroke-width="2" opacity="0.9"/><text x="388" y="197" text-anchor="start" font-size="12" font-weight="400" fill="#173f58">action obligatoire</text><text x="300" y="238" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">IEC 60204-1 : équipement électrique des machines</text></svg>
