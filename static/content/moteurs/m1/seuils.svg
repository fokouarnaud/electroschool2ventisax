<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Seuils indicatifs des effets d'un courant alternatif 50 Hz traversant le corps, de la perception à la fibrillation</title><rect width="560" height="250" rx="14" fill="#fcfefe"/><rect x="150" y="26" width="69.9" height="30" rx="4" fill="#0d665e" opacity="0.51"/><text x="142" y="46" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">perception</text><text x="227.9" y="46" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">0,5 mA</text><rect x="150" y="70" width="200" height="30" rx="4" fill="#0d665e" opacity="0.68"/><text x="142" y="90" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">non-lâcher</text><text x="358" y="90" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">10 mA</text><rect x="150" y="114" width="247.7" height="30" rx="4" fill="#0d665e" opacity="0.84"/><text x="142" y="134" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">asphyxie</text><text x="405.7" y="134" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">30 mA</text><rect x="150" y="158" width="287.5" height="30" rx="4" fill="#0d665e" opacity="1.00"/><text x="142" y="178" text-anchor="end" font-size="12" font-weight="600" fill="#173f58">fibrillation</text><text x="445.5" y="178" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">75 mA</text><text x="300" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">courant traversant le corps (mA)</text><text x="280" y="236" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">seuils indicatifs, 50 Hz, quelques secondes</text></svg>
