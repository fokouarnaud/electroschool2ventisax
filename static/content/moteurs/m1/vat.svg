<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="620" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Vérifier l'absence de tension : essayer le VAT sur une source connue, mesurer, puis l'essayer de nouveau</title><rect width="620" height="170" rx="14" fill="#fcfefe"/><rect x="20" y="40" width="180" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="110" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">sur une source connue</text><text x="110" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">le VAT fonctionne</text><polyline points="200,65 220,65" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="220,65 211.9,68.9 211.9,61.1" fill="#173f58"/><rect x="220" y="40" width="180" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="310" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">sur l'équipement</text><text x="310" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">absence de tension ?</text><polyline points="400,65 420,65" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="420,65 411.9,68.9 411.9,61.1" fill="#173f58"/><rect x="420" y="40" width="180" height="50" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="510" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">de nouveau sur la source</text><text x="510" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">le VAT fonctionne encore</text></svg>
