<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Les cinq étapes de la consignation : séparer, condamner, identifier, vérifier l'absence de tension, mettre à la terre</title><rect width="680" height="160" rx="14" fill="#fcfefe"/><rect x="14" y="40" width="124" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="76" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">1. séparer</text><polyline points="138,62 151,62" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="151,62 142.9,65.9 142.9,58.1" fill="#173f58"/><rect x="151" y="40" width="124" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="213" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">2. condamner</text><polyline points="275,62 288,62" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="288,62 279.9,65.9 279.9,58.1" fill="#173f58"/><rect x="288" y="40" width="124" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="350" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">3. identifier</text><polyline points="412,62 425,62" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="425,62 416.9,65.9 416.9,58.1" fill="#173f58"/><rect x="425" y="40" width="124" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="487" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">4. vérifier</text><polyline points="549,62 562,62" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="562,62 553.9,65.9 553.9,58.1" fill="#173f58"/><rect x="562" y="40" width="124" height="44" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="624" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">5. mettre à la terre</text><text x="608" y="108" text-anchor="middle" font-size="11" font-weight="400" fill="#7d93a0">et en court-circuit</text></svg>
