<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Bilan de puissance : 14 W absorbés au primaire, 12 W fournis au secondaire, 2 W de pertes</title><rect width="500" height="230" rx="14" fill="#fcfefe"/><rect x="190" y="60" width="120" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="250" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">transformateur</text><polyline points="50,90 188,90" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="188,90 179.9,93.9 179.9,86.1" fill="#0d665e"/><text x="119" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#0d665e">Pp = 14 W</text><polyline points="312,90 450,90" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="450,90 441.9,93.9 441.9,86.1" fill="#0d665e"/><text x="381" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#0d665e">Ps = 12 W</text><polyline points="250,122 250,175" fill="none" stroke="#7d93a0" stroke-width="2" stroke-linejoin="round"/><polygon points="250,175 246.1,166.9 253.9,166.9" fill="#7d93a0"/><text x="250" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#7d93a0">pertes fer et cuivre : 2 W</text><text x="250" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">η = 12 / 14 ≈ 86 %</text></svg>
