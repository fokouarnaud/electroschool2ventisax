<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Vu du primaire, le haut-parleur de 8 Ω se comporte comme une résistance de 800 Ω</title><rect width="460" height="200" rx="14" fill="#fcfefe"/><rect x="30" y="60" width="120" height="60" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="90" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">amplificateur</text><polyline points="150,75 300,75 300,80" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(300,80) rotate(90)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="12" y2="0"/><line x1="48" y1="0" x2="60" y2="0"/><g transform="translate(12,0)"><rect x="0" y="-7" width="36" height="14" rx="2" fill="#fcfefe"/></g></g><text x="318" y="108" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">Zp</text><text x="318" y="124" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">800 Ω</text><polyline points="300,140 300,145 150,145 150,105" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="230" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#7d93a0">vu du primaire</text><text x="230" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#0d665e">Zp = 8 × 10² = 800 Ω</text></svg>
