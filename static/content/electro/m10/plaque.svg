<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Plaque signalétique d'un transformateur : tensions, courant du secondaire et puissance apparente</title><rect width="420" height="200" rx="14" fill="#fcfefe"/><rect x="60" y="30" width="300" height="140" rx="10" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="210" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">Primaire : 230 V ~ 50 Hz</text><text x="210" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">Secondaire : 12 V ~ 1 A</text><text x="210" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">Puissance : 12 VA</text></svg>
