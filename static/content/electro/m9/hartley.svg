<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Oscillateur Hartley : deux bobines L1, L2 et un condensateur C fixent la fréquence</title><rect width="500" height="300" rx="14" fill="#fcfefe"/><polygon points="220,40 220,100 280,70" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="240" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">A</text><polyline points="280,70 370,70 370,150" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><circle cx="370" cy="150" r="3.5" fill="#173f58"/><polyline points="220,70 130,70 130,150" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><circle cx="130" cy="150" r="3.5" fill="#173f58"/><polyline points="130,150 234,150" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(234,150) rotate(0)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="0" y2="0"/><line x1="32" y1="0" x2="32" y2="0"/><g transform="translate(0,0)"><line x1="0" y1="0" x2="12" y2="0"/><line x1="12" y1="-13" x2="12" y2="13"/><line x1="20" y1="-13" x2="20" y2="13"/><line x1="20" y1="0" x2="32" y2="0"/></g></g><text x="250" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">C</text><text x="250" y="134" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">2,2 nF</text><polyline points="266,150 370,150" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(130,150) rotate(90)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="25" y2="0"/><line x1="65" y1="0" x2="90" y2="0"/><g transform="translate(25,0)"><path d="M0 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0"/></g></g><text x="112" y="193" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">L1</text><text x="112" y="209" text-anchor="end" font-size="12" font-weight="400" fill="#7d93a0">50 µH</text><g transform="translate(370,150) rotate(90)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="25" y2="0"/><line x1="65" y1="0" x2="90" y2="0"/><g transform="translate(25,0)"><path d="M0 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0"/></g></g><text x="388" y="193" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">L2</text><text x="388" y="209" text-anchor="start" font-size="12" font-weight="400" fill="#7d93a0">50 µH</text><polyline points="130,240 370,240" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="250,240 250,248" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="238,248 262,248" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="242,253 258,253" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="246,258 254,258" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="250" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#0d665e">f = 1 / (2π × √((L1 + L2) × C))</text></svg>
