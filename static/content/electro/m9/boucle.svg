<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Boucle d'un oscillateur : l'amplificateur de gain A et le réseau de rétroaction B ramènent la sortie à l'entrée</title><rect width="500" height="230" rx="14" fill="#fcfefe"/><polygon points="215,45 215,115 285,80" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="238.3" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">A</text><polyline points="285,80 440,80" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><circle cx="440" cy="80" r="4" fill="#fcfefe" stroke="#173f58" stroke-width="2"/><text x="450" y="85" text-anchor="start" font-size="13" font-weight="600" fill="#0d665e">sortie</text><polyline points="380,80 380,170 310,170" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><circle cx="380" cy="80" r="3.5" fill="#173f58"/><rect x="190" y="150" width="120" height="40" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="250" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#173f58">B</text><polyline points="190,170 120,170 120,80" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polyline points="120,80 215,80" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><polygon points="215,80 206.9,83.9 206.9,76.1" fill="#173f58"/><text x="250" y="135" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">gain A</text><text x="250" y="212" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">réseau de rétroaction B</text><text x="60" y="40" text-anchor="start" font-size="13" font-weight="700" fill="#0d665e">A × B ≥ 1</text></svg>
