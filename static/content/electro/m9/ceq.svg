<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Deux condensateurs de 10 nF en série équivalent à un seul de 5 nF</title><rect width="480" height="170" rx="14" fill="#fcfefe"/><polyline points="40,70 70,70" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(70,70) rotate(0)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="14" y2="0"/><line x1="46" y1="0" x2="60" y2="0"/><g transform="translate(14,0)"><line x1="0" y1="0" x2="12" y2="0"/><line x1="12" y1="-13" x2="12" y2="13"/><line x1="20" y1="-13" x2="20" y2="13"/><line x1="20" y1="0" x2="32" y2="0"/></g></g><text x="100" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">C1</text><text x="100" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">10 nF</text><polyline points="130,70 160,70" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(160,70) rotate(0)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="14" y2="0"/><line x1="46" y1="0" x2="60" y2="0"/><g transform="translate(14,0)"><line x1="0" y1="0" x2="12" y2="0"/><line x1="12" y1="-13" x2="12" y2="13"/><line x1="20" y1="-13" x2="20" y2="13"/><line x1="20" y1="0" x2="32" y2="0"/></g></g><text x="190" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">C2</text><text x="190" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">10 nF</text><polyline points="220,70 250,70" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="285" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="#173f58">=</text><polyline points="320,70 350,70" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><g transform="translate(350,70) rotate(0)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="14" y2="0"/><line x1="46" y1="0" x2="60" y2="0"/><g transform="translate(14,0)"><line x1="0" y1="0" x2="12" y2="0"/><line x1="12" y1="-13" x2="12" y2="13"/><line x1="20" y1="-13" x2="20" y2="13"/><line x1="20" y1="0" x2="32" y2="0"/></g></g><text x="380" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">Céq</text><text x="380" y="54" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">5 nF</text><polyline points="410,70 440,70" fill="none" stroke="#173f58" stroke-width="2" stroke-linejoin="round"/><text x="240" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#0d665e">Céq = C1 × C2 / (C1 + C2)</text></svg>
