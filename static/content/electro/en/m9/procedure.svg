<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="460" height="280" rx="14" fill="#fcfefe"/><rect x="80" y="20" width="300" height="42" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="230" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">1. Choose the frequency f</text><polyline points="230,62 230,84" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="230,84 226.1,75.9 233.9,75.9" fill="#0d665e"/><rect x="80" y="85" width="300" height="42" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="230" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">2. Choose L, calculate C</text><polyline points="230,127 230,149" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="230,149 226.1,140.9 233.9,140.9" fill="#0d665e"/><rect x="80" y="150" width="300" height="42" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="230" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">3. Check A × B ≥ 1 and the phase</text><polyline points="230,192 230,214" fill="none" stroke="#0d665e" stroke-width="2" stroke-linejoin="round"/><polygon points="230,214 226.1,205.9 233.9,205.9" fill="#0d665e"/><rect x="80" y="215" width="300" height="42" rx="8" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><text x="230" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">4. Measure f and adjust</text></svg>
