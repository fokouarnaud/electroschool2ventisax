<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="420" height="200" rx="14" fill="#fcfefe"/><g transform="translate(60,80) rotate(0)" fill="none" stroke="#173f58" stroke-width="2"><line x1="0" y1="0" x2="139" y2="0"/><line x1="161" y1="0" x2="300" y2="0"/><g transform="translate(139,0)"><polygon points="0,-11 0,11 22,0" fill="#fcfefe"/><line x1="22" y1="-11" x2="22" y2="11"/><line x1="8" y1="-16" x2="18" y2="-27"/><polyline points="12,-27 18,-27 18,-21"/><line x1="16" y1="-14" x2="26" y2="-25"/><polyline points="20,-25 26,-25 26,-19"/></g></g><text x="80" y="62" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">Anode (+)</text><text x="340" y="62" text-anchor="end" font-size="13" font-weight="600" fill="#173f58">Cathode (−)</text><text x="210" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#0d665e">long leg = anode; flat edge = cathode</text><text x="210" y="166" text-anchor="middle" font-size="12" font-weight="400" fill="#7d93a0">threshold: red ≈ 1.8 V, green ≈ 2.1 V, blue ≈ 3 V</text></svg>
