<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="560" height="240" rx="14" fill="#fcfefe"/><polygon points="60,200 210,200 210,50" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><polyline points="198,200 198,188 210,188" fill="none" stroke="#173f58"/><text x="135" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">R = 1 kΩ</text><text x="220" y="125" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">Xc = 1 kΩ</text><text x="123" y="117" text-anchor="end" font-size="13" font-weight="600" fill="#0d665e">Z ≈ 1.41 kΩ</text><text x="102" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">φ</text><text x="310" y="100" text-anchor="start" font-size="12" font-weight="600" fill="#173f58">Z = √(R² + Xc²)</text><text x="310" y="128" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">φ = arctan(Xc / R) = 45°</text></svg>
