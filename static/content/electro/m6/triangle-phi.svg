<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Déphasage d'un RC série : R = 1 kΩ et Xc = 577 Ω donnent φ = 30°</title><rect width="600" height="240" rx="14" fill="#fcfefe"/><polygon points="60,200 260,200 260,84.6" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><polyline points="248,200 248,188 260,188" fill="none" stroke="#173f58"/><text x="160" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">R = 1 kΩ</text><text x="270" y="142.3" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">Xc = 577 Ω</text><text x="148" y="134.3" text-anchor="end" font-size="13" font-weight="600" fill="#0d665e">Z ≈ 1,15 kΩ</text><text x="102" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">φ</text><text x="370" y="120" text-anchor="start" font-size="12" font-weight="600" fill="#173f58">tan φ = Xc / R = 0,577</text><text x="370" y="148" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">φ = arctan 0,577 ≈ 30°</text></svg>
