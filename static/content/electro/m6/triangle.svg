<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Triangle rectangle de côtés 3, 4 et 5 : Pythagore et tangente</title><rect width="500" height="240" rx="14" fill="#fcfefe"/><polygon points="60,200 240,200 240,65" fill="#eef4f3" stroke="#173f58" stroke-width="2"/><polyline points="228,200 228,188 240,188" fill="none" stroke="#173f58"/><text x="150" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#173f58">a = 4</text><text x="250" y="132.5" text-anchor="start" font-size="13" font-weight="600" fill="#173f58">b = 3</text><text x="138" y="124.5" text-anchor="end" font-size="13" font-weight="600" fill="#0d665e">c = 5</text><text x="102" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#0d665e">θ</text><text x="300" y="90" text-anchor="start" font-size="12" font-weight="600" fill="#173f58">c = √(a² + b²) = √25 = 5</text><text x="300" y="118" text-anchor="start" font-size="12" font-weight="600" fill="#173f58">tan θ = b / a = 0,75</text><text x="300" y="146" text-anchor="start" font-size="12" font-weight="600" fill="#0d665e">θ = arctan 0,75 ≈ 36,9°</text></svg>
